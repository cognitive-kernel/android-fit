plugins { id 'com.android.application' }
android {
    namespace 'com.cognitivekernel.androidfit'
    compileSdk 36
    signingConfigs {
        stableDebug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
    defaultConfig {
        applicationId 'com.cognitivekernel.androidfit'
        minSdk 23
        targetSdk 35
        versionCode (project.findProperty('FIT_YAR_VERSION_CODE') ?: '99').toString().toInteger()
        versionName (project.findProperty('FIT_YAR_VERSION_NAME') ?: '1.1.4').toString()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
