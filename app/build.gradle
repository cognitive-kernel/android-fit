plugins { id 'com.android.application' }
def stableDebugKeystore = file(System.getenv('FIT_YAR_SIGNING_KEYSTORE') ?: (System.getProperty("user.home") + "/.android/debug.keystore"))
def stableDebugStorePassword = System.getenv('FIT_YAR_RELEASE_STORE_PASSWORD') ?: "android"
def stableDebugKeyAlias = System.getenv('FIT_YAR_RELEASE_KEY_ALIAS') ?: "androiddebugkey"
def stableDebugKeyPassword = System.getenv('FIT_YAR_RELEASE_KEY_PASSWORD') ?: "android"

def generatedExerciseAssets = layout.buildDirectory.dir("generated/exercise-index/assets")

tasks.register("generateExerciseAssetIndex") {
    inputs.dir("src/main/assets/exercises")
    outputs.file(generatedExerciseAssets.map { it.file("exercise-index.txt") })
    doLast {
        def exerciseRoot = file("src/main/assets/exercises")
        def output = generatedExerciseAssets.get().file("exercise-index.txt").asFile
        output.parentFile.mkdirs()
        def paths = fileTree(exerciseRoot).matching { include "**/*.gif" }.files
            .collect { "exercises/" + exerciseRoot.toPath().relativize(it.toPath()).toString().replace(File.separator, "/") }
            .sort { left, right -> left.compareToIgnoreCase(right) }
        output.withWriter("UTF-8") { writer -> paths.each { writer.write(it); writer.write("\\n") } }
        logger.lifecycle("Generated exercise asset index: ${paths.size()} GIF files")
    }
}

android {
    sourceSets { main.assets.srcDir(generatedExerciseAssets) }
    namespace 'com.cognitivekernel.androidfit'
    compileSdk 36
    signingConfigs {
        stableDebug {
            storeFile stableDebugKeystore
            storePassword stableDebugStorePassword
            keyAlias stableDebugKeyAlias
            keyPassword stableDebugKeyPassword
        }
    }
    buildTypes {
        debug {
            if (providers.gradleProperty('FIT_YAR_TEST_INSTALL').orNull == 'true') {
                applicationIdSuffix '.test2'
                versionNameSuffix '-test'
            }
            if (stableDebugKeystore.exists()) signingConfig signingConfigs.stableDebug
        }
    }
    defaultConfig {
        applicationId 'com.cognitivekernel.androidfit'
        minSdk 23
        targetSdk 36
        versionCode providers.gradleProperty('FIT_YAR_VERSION_CODE').getOrElse('115').toInteger()
        versionName providers.gradleProperty('FIT_YAR_VERSION_NAME').getOrElse('1.1.19')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

 tasks.named('preBuild').configure { dependsOn tasks.named('generateExerciseAssetIndex') }
