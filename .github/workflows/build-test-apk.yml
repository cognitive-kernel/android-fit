name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/build-test-apk.yml"

permissions:
  contents: read

jobs:
  build-side-by-side-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-36" "build-tools;36.0.0"; then
              exit 0
            fi
            echo "SDK install attempt $attempt failed; retrying."
            sleep 5
          done
          echo "::error::Android SDK packages could not be installed after three attempts."
          exit 1

      - name: Build isolated test APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -PFIT_YAR_TEST_INSTALL=true assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.cognitivekernel.androidfit.test2'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          mkdir -p artifacts
          cp "$APK" artifacts/android-fit-side-by-side-test.apk
          cp signature.txt artifacts/signature.txt
          sha256sum artifacts/android-fit-side-by-side-test.apk > artifacts/SHA256SUMS.txt

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidFit-side-by-side-test-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
