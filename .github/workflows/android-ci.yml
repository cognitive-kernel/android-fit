name: Android CI

on:
  push:
    branches:
      - main
      - ci/verify-workout-app
      - feature/performance-report
      - feature/background-step-counter
      - 'release/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  unit-tests-and-lint:
    name: Unit tests, lint, and Android test compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests, lint, and compile instrumentation tests
        run: gradle --no-daemon test lintDebug compileDebugAndroidTestJavaWithJavac

  gif-and-fullscreen-regression:
    name: GIF assets, resolver, and fullscreen regression tests (no emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "platforms;android-36" "build-tools;36.0.0"
      - name: Run GIF and fullscreen regression tests on Robolectric
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest --tests com.cognitivekernel.androidfit.ExerciseImagesRegressionTest

  test-install-apk:
    name: Build isolated test-install APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build isolated test APK
        run: gradle --no-daemon -PFIT_YAR_TEST_INSTALL=true assembleDebug
      - name: Verify test APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.cognitivekernel.androidfit.test2'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/fityar-test-side-by-side.apk
          sha256sum artifacts/fityar-test-side-by-side.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fityar-test-side-by-side
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  signing-key-diagnostic:
    name: Check original signing-key availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: fit-yar-debug-signing-key-v2
      - name: Check original signing key without exposing it
        shell: bash
        env:
          FIT_YAR_DEBUG_KEYSTORE_BASE64: ${{ secrets.FIT_YAR_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          EXPECTED_SHA256="57:82:64:31:52:17:B7:96:51:A8:6F:36:07:C6:EC:5A:9C:0A:17:85:D4:61:AA:D5:76:A4:CB:EC:A4:D3:64:47"
          KEY="$HOME/.android/debug.keystore"
          if [ -f "$KEY" ] && keytool -list -v -keystore "$KEY" -storepass android -alias androiddebugkey 2>/dev/null | grep -Fq "$EXPECTED_SHA256"; then
            echo "::notice::Original signing key is available in the Actions cache."
            exit 0
          fi
          found_secret=false
          for candidate in "${FIT_YAR_DEBUG_KEYSTORE_BASE64:-}" "${ANDROID_KEYSTORE_BASE64:-}" "${KEYSTORE_BASE64:-}"; do
            [ -n "$candidate" ] || continue
            found_secret=true
            TEMP_KEY="$(mktemp)"
            if printf '%s' "$candidate" | base64 --decode > "$TEMP_KEY" 2>/dev/null \
              && keytool -list -v -keystore "$TEMP_KEY" -storepass android -alias androiddebugkey 2>/dev/null | grep -Fq "$EXPECTED_SHA256"; then
              echo "::notice::A configured Actions secret contains the expected signing key."
              rm -f "$TEMP_KEY"
              exit 0
            fi
            rm -f "$TEMP_KEY"
          done
          if [ "$found_secret" = true ]; then
            echo "::warning::Configured keystore candidates do not match the registered certificate or cannot be opened."
          else
            echo "::warning::No matching signing key was found. The production APK will not be published."
          fi

  release-key-corrected-apk:
    name: Build, verify, and publish update-compatible APK
    needs: [unit-tests-and-lint, gif-and-fullscreen-regression]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore candidate release keystore
        shell: bash
        env:
          FIT_YAR_RELEASE_KEYSTORE_BASE64: ${{ secrets.FIT_YAR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${FIT_YAR_RELEASE_KEYSTORE_BASE64:-}" || { echo "::error::Release keystore secret is missing."; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$FIT_YAR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/fityar-release-test.jks"
          test -s "$HOME/.android/fityar-release-test.jks"
      - name: Build and verify APK with the existing release certificate
        shell: bash
        env:
          FIT_YAR_RELEASE_KEY_ALIAS: ${{ secrets.FIT_YAR_RELEASE_KEY_ALIAS }}
          FIT_YAR_RELEASE_KEY_PASSWORD: ${{ secrets.FIT_YAR_RELEASE_KEY_PASSWORD }}
          FIT_YAR_RELEASE_STORE_PASSWORD: ${{ secrets.FIT_YAR_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          export FIT_YAR_SIGNING_KEYSTORE="$HOME/.android/fityar-release-test.jks"
          test -n "${FIT_YAR_RELEASE_KEY_ALIAS:-}"
          test -n "${FIT_YAR_RELEASE_KEY_PASSWORD:-}"
          test -n "${FIT_YAR_RELEASE_STORE_PASSWORD:-}"
          gradle --no-daemon -PFIT_YAR_VERSION_CODE=118 -PFIT_YAR_VERSION_NAME=1.1.22 assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.cognitivekernel.androidfit'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionCode='118'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionName='1.1.22'"
          mkdir -p artifacts
          cp "$APK" artifacts/fityar-large-library-v118.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs artifacts/fityar-large-library-v118.apk | tee artifacts/signature.txt
          ACTUAL_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' artifacts/signature.txt | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="61dbac4c3b3936ad0da75c021781d194d997de0e6718e0f153c85f14629f0c4a"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK certificate does not match the previously distributed FitYar signing certificate."
            exit 1
          fi
          sha256sum artifacts/fityar-large-library-v118.apk > artifacts/SHA256SUMS.txt
      - name: Publish verified APK as a GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.22 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.1.22 already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create v1.1.22 \
            artifacts/fityar-large-library-v118.apk \
            artifacts/signature.txt \
            artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "FitYar 1.1.22" \
            --notes "FitYar 1.1.22. Version code 118. Signed with the verified FitYar release certificate."
      - uses: actions/upload-artifact@v4
        with:
          name: fityar-large-library-v118
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
