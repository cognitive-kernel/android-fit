name: Android CI
on:
  push:
    branches: [ main, ci/verify-workout-app, feature/performance-report, feature/background-step-counter ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore stable debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: fit-yar-debug-signing-key-v1
      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Save stable debug signing key
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: fit-yar-debug-signing-key-v1
      - name: Verify stable signing certificate
        shell: bash
        run: |
          set -euo pipefail
          CERT_INFO="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey)"
          echo "$CERT_INFO" | grep -E 'SHA1:|SHA256:|Valid from:'
          EXPECTED_SHA256="57:82:64:31:52:17:B7:96:51:A8:6F:36:07:C6:EC:5A:9C:0A:17:85:D4:61:AA:D5:76:A4:CB:EC:A4:D3:64:47"
          if ! echo "$CERT_INFO" | grep -Fq "$EXPECTED_SHA256"; then
            echo "::error::Signing certificate fingerprint changed. Refusing to build APKs."
            exit 1
          fi
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle test
      - name: Run Android lint
        run: gradle lintDebug
      - name: Build test APKs 99 and 100
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug -PFIT_YAR_VERSION_CODE=99 -PFIT_YAR_VERSION_NAME=1.1.4-test99
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/fit-yar-v99.apk
          gradle assembleDebug -PFIT_YAR_VERSION_CODE=100 -PFIT_YAR_VERSION_NAME=1.1.4-test100
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/fit-yar-v100.apk
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs artifacts/fit-yar-v99.apk | tee /tmp/v99-certs.txt
          "$APKSIGNER" verify --print-certs artifacts/fit-yar-v100.apk | tee /tmp/v100-certs.txt
          grep -F "Signer #1 certificate SHA-256 digest: 578264315217b79651a86f3607c6ec5a9c0a1785d461aad576a4cbeca4d36447" /tmp/v99-certs.txt
          grep -F "Signer #1 certificate SHA-256 digest: 578264315217b79651a86f3607c6ec5a9c0a1785d461aad576a4cbeca4d36447" /tmp/v100-certs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fit-yar-v99
          path: artifacts/fit-yar-v99.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fit-yar-v100
          path: artifacts/fit-yar-v100.apk
          if-no-files-found: error
  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          packages=( "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" )
          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android SDK download failed (attempt $attempt/3); retrying after clearing incomplete package archives..."
              rm -rf "$ANDROID_SDK_ROOT/temp" "$ANDROID_HOME/temp"
              sleep 10
            fi
          done
          echo "Android SDK installation failed after 3 attempts."
          exit 1
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: gradle connectedDebugAndroidTest
