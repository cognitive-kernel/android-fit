name: Build GymVisual exercise-name catalog

on:
  push:
    branches:
      - feature/gymvisual-exercise-library
    paths:
      - "tools/match_gymvisual.py"
      - ".github/workflows/gymvisual-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Match existing GIF names
        run: python tools/match_gymvisual.py
      - name: Commit generated name catalog and report
        run: |
          if git diff --quiet -- app/src/main/assets/exercises/exercise_catalog.json gymvisual-match-report.csv; then
            echo "Catalog and report are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/exercises/exercise_catalog.json gymvisual-match-report.csv
          git commit -m "Generate exercise names from GymVisual media IDs"
          git push
